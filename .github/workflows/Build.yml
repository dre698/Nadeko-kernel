# MTK Kernel Build - unified workflow, tick any variants and they all build in parallel
#
#   vanilla            : no KSU (blossom_noksu_defconfig, shattered-Clang-15)
#   nadekosu           : NadekoSU
#   nadekosu_oc        : NadekoSU + overclock (L cluster 2501MHz)
#   nadekosu_susfs     : NadekoSU + SUSFS
#   nadekosu_susfs_oc  : NadekoSU + SUSFS + overclock
#   toolchain          : auto = shattered-Clang-15 for vanilla, crdroid Clang for the rest

name: Build Nadeko Kernel

on:
  workflow_dispatch:
    inputs:
      vanilla:
        description: "Vanilla (no KSU)"
        required: false
        default: false
        type: boolean
      nadekosu:
        description: "NadekoSU"
        required: false
        default: true
        type: boolean
      nadekosu_oc:
        description: "NadekoSU + OC"
        required: false
        default: false
        type: boolean
      nadekosu_susfs:
        description: "NadekoSU + SUSFS"
        required: false
        default: false
        type: boolean
      nadekosu_susfs_oc:
        description: "NadekoSU + SUSFS + OC"
        required: false
        default: false
        type: boolean
      toolchain:
        description: "Toolchain (auto = shattered for vanilla, crdroid for the rest)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - crdroid-clang
          - shattered-clang-15
      prebuilts:
        description: "Also upload prebuilt artifacts (kernel, dtb, modules, headers)"
        required: false
        default: true
        type: boolean
      notify:
        description: "Send result to Telegram"
        required: false
        default: true
        type: boolean
      thread_id:
        description: "Telegram topic (message_thread_id)"
        required: false
        default: "2"
        type: string

env:
  TZ: "Asia/Jakarta"
  KERNEL_ARCH: "arm64"
  KBUILD_BUILD_USER: "Telegram"
  KBUILD_BUILD_HOST: "dre698"
  BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
  THREAD_ID: ${{ inputs.thread_id }}

jobs:
  setup:
    name: Select variants
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - name: Build matrix
        id: m
        run: |
          ITEMS=""
          add() { ITEMS="${ITEMS:+$ITEMS,}{\"name\":\"$1\",\"ksu\":\"$2\",\"susfs\":\"$3\",\"oc\":\"$4\"}"; }
          [ "${{ inputs.vanilla }}" = "true" ]           && add vanilla none false false
          [ "${{ inputs.nadekosu }}" = "true" ]          && add nadekosu nadekosu false false
          [ "${{ inputs.nadekosu_oc }}" = "true" ]       && add nadekosu-oc nadekosu false true
          [ "${{ inputs.nadekosu_susfs }}" = "true" ]    && add nadekosu-susfs nadekosu true false
          [ "${{ inputs.nadekosu_susfs_oc }}" = "true" ] && add nadekosu-susfs-oc nadekosu true true
          if [ -z "$ITEMS" ]; then
            echo "::error::No variant selected"; exit 1
          fi
          echo "matrix=[$ITEMS]" >> $GITHUB_OUTPUT
          echo "matrix=[$ITEMS]"

  build_and_package:
    name: Build ${{ matrix.name }}
    needs: setup
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve build config
        run: |
          KSU="${{ matrix.ksu }}"
          SUSFS="${{ matrix.susfs }}"
          OC="${{ matrix.oc }}"
          TOOLCHAIN="${{ inputs.toolchain }}"

          if [ "$KSU" = "none" ]; then
            DEFCONFIG="blossom_noksu_defconfig"
          else
            DEFCONFIG="blossom_defconfig"
          fi

          if [ "$TOOLCHAIN" = "auto" ]; then
            if [ "$KSU" = "none" ]; then TOOLCHAIN="shattered-clang-15"; else TOOLCHAIN="crdroid-clang"; fi
          fi

          # fail early on combinations that can't build, instead of after 20 minutes
          if [ "$SUSFS" = "true" ] && [ "$KSU" != "nadekosu" ]; then
            echo "::error::SUSFS needs ksu=nadekosu (got ksu=$KSU)"; exit 1
          fi

          TAGS=""
          KSTRING=""
          [ "$SUSFS" = "true" ] && TAGS="${TAGS}-SUSFS"
          [ "$OC" = "true" ] && TAGS="${TAGS}-OC"
          if [ "$SUSFS" = "true" ] && [ "$OC" = "true" ]; then KSTRING="SUSFS + Overclocked Version"
          elif [ "$SUSFS" = "true" ]; then KSTRING="SUSFS Version"
          elif [ "$OC" = "true" ]; then KSTRING="Overclocked Version"
          fi

          {
            echo "KSU=$KSU"
            echo "SUSFS=$SUSFS"
            echo "OC=$OC"
            echo "KERNEL_DEFCONFIG=$DEFCONFIG"
            echo "TOOLCHAIN=$TOOLCHAIN"
            echo "VARIANT_TAGS=$TAGS"
            echo "KERNEL_STRING=$KSTRING"
          } >> $GITHUB_ENV

          echo "ksu=$KSU susfs=$SUSFS oc=$OC defconfig=$DEFCONFIG toolchain=$TOOLCHAIN"

      - name: Install dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y bc bison flex build-essential libssl-dev libelf-dev cpio kmod git zip curl ca-certificates jq \
            wget libffi-dev zlib1g-dev libreadline-dev libsqlite3-dev libbz2-dev libncurses5-dev libgdbm-dev liblzma-dev tk-dev

      - name: Configure git
        run: |
          git config --global http.sslVerify false
          git config --global url."https://".insteadOf git://

      # ---------- toolchain: crdroid Clang + LineageOS GCC ----------
      - name: Clone crdroid Clang
        if: env.TOOLCHAIN == 'crdroid-clang'
        run: |
          echo "Cloning crdroid Clang..."
          git clone --depth=1 https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r428724.git /tmp/clang

      - name: Clone LineageOS GCC toolchains
        if: env.TOOLCHAIN == 'crdroid-clang'
        run: |
          echo "Cloning GCC ARM64..."
          GIT_SSL_NO_VERIFY=1 git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git /tmp/gcc-aarch64

          echo "Cloning GCC ARM32..."
          GIT_SSL_NO_VERIFY=1 git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git /tmp/gcc-arm

      - name: Verify crdroid toolchains
        if: env.TOOLCHAIN == 'crdroid-clang'
        run: |
          echo "CLANG_DIR=/tmp/clang" >> $GITHUB_ENV
          /tmp/clang/bin/clang --version
          /tmp/gcc-aarch64/bin/aarch64-linux-android-gcc --version
          /tmp/gcc-arm/bin/arm-linux-androideabi-gcc --version

      # ---------- toolchain: shattered-Clang-15 + LLD ----------
      - name: Download shattered-Clang-15
        if: env.TOOLCHAIN == 'shattered-clang-15'
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          mkdir -p /tmp/shattered
          curl -Lo /tmp/shattered.tar.gz \
            "https://github.com/erabye/shattered-clang/releases/download/shattered-Clang-15.0.7/shattered-Clang-15.0.7.tar.gz"
          tar -zxf /tmp/shattered.tar.gz -C /tmp/shattered

      - name: Verify shattered toolchain
        if: env.TOOLCHAIN == 'shattered-clang-15'
        run: |
          echo "CLANG_DIR=/tmp/shattered" >> $GITHUB_ENV
          export PATH="/tmp/shattered/bin:/usr/bin:${PATH}"
          for tool in clang ld.lld llvm-nm llvm-ar llvm-objcopy llvm-objdump llvm-readelf llvm-strip; do
            if ! command -v "$tool" >/dev/null; then
              echo "✗ $tool not found in /tmp/shattered/bin"
              ls -lah /tmp/shattered/bin
              exit 1
            fi
          done
          clang --version
          ld.lld --version
          aarch64-linux-gnu-gcc --version
          arm-linux-gnueabi-gcc --version

      # ---------- KSU: NadekoSU ----------
      - name: Clean stale KernelSU placeholder
        if: env.KSU == 'nadekosu'
        run: |
          echo "Removing any leftover/broken KernelSU directory before NadekoSU setup..."
          rm -rf KernelSU
          rm -f drivers/kernelsu
          echo "Done."

      - name: Integrate NadekoSU
        if: env.KSU == 'nadekosu'
        run: |
          curl -LSs "https://raw.githubusercontent.com/dre698/NadekoSU/main/kernel/setup.sh" | bash

      - name: Get NadekoSU version
        if: env.KSU == 'nadekosu'
        run: |
          NSU_GIT_VER=$(cd KernelSU && git rev-list --count HEAD 2>/dev/null || echo "0")
          NSU_VER=$((33300 + NSU_GIT_VER))
          echo "KSU_TAG=-nsu${NSU_VER}" >> $GITHUB_ENV
          echo "NadekoSU version: $NSU_VER"

      # ---------- add-on: SUSFS ----------
      - name: Apply SUSFS patch
        if: env.SUSFS == 'true'
        run: |
          chmod +x .github/scripts/susfs_setup.sh
          .github/scripts/susfs_setup.sh

      - name: Upload SUSFS rejects
        uses: actions/upload-artifact@v4
        if: failure() && env.SUSFS == 'true'
        with:
          name: susfs-rejects-${{ matrix.name }}
          path: susfs-rejects/
          retention-days: 7

      - name: Enable SUSFS Kconfig options
        if: env.SUSFS == 'true'
        run: |
          DEFCONFIG="arch/${KERNEL_ARCH}/configs/${KERNEL_DEFCONFIG}"
          sed -i '/^CONFIG_KSU_MANUAL_HOOK=/d;/^CONFIG_KSU_TRACEPOINT_HOOK=/d' "$DEFCONFIG"
          cat >> "$DEFCONFIG" << 'EOF'
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          EOF
          grep KSU_SUSFS "$DEFCONFIG"

      # ---------- add-on: overclock ----------
      - name: Apply OC patch
        if: env.OC == 'true'
        run: python3 .github/scripts/oc_patch.py

      - name: Set CONFIG_LOCALVERSION
        if: env.SUSFS == 'true' || env.OC == 'true'
        run: |
          DEFCONFIG="arch/${KERNEL_ARCH}/configs/${KERNEL_DEFCONFIG}"
          sed -i '/^CONFIG_LOCALVERSION=/d;/^CONFIG_LOCALVERSION_AUTO=/d;/^# CONFIG_LOCALVERSION_AUTO/d' "$DEFCONFIG"
          echo "CONFIG_LOCALVERSION=\"-Nadeko${VARIANT_TAGS}\"" >> "$DEFCONFIG"
          echo "# CONFIG_LOCALVERSION_AUTO is not set" >> "$DEFCONFIG"
          grep LOCALVERSION "$DEFCONFIG"

      # ---------- build ----------
      - name: Build kernel
        run: |
          set -o pipefail
          START_TIME=$(date +%s)

          if [ "$TOOLCHAIN" = "shattered-clang-15" ]; then
            export PATH="/tmp/shattered/bin:/usr/bin:${PATH}"
            MAKE_ARGS="O=out ARCH=${KERNEL_ARCH} SUBARCH=${KERNEL_ARCH} \
              CC=clang LD=ld.lld NM=llvm-nm AR=llvm-ar STRIP=llvm-strip \
              OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump READELF=llvm-readelf \
              LLVM_IAS=1 HOSTCC=clang HOSTCXX=clang++ HOSTLD=ld.lld HOSTAR=llvm-ar \
              CROSS_COMPILE=aarch64-linux-gnu- \
              CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
              CROSS_COMPILE_COMPAT=arm-linux-gnueabi-"
            make ${MAKE_ARGS} ${KERNEL_DEFCONFIG}
            make ${MAKE_ARGS} olddefconfig
          else
            export PATH="/tmp/clang/bin:/tmp/gcc-aarch64/bin:/tmp/gcc-arm/bin:${PATH}"
            MAKE_ARGS="O=out ARCH=${KERNEL_ARCH} CC=clang \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              CROSS_COMPILE=aarch64-linux-android- \
              CROSS_COMPILE_ARM32=arm-linux-androideabi-"
            make ${MAKE_ARGS} ${KERNEL_DEFCONFIG}
          fi

          echo "Building kernel (ksu=${KSU} susfs=${SUSFS} oc=${OC})..."
          make -j$(nproc) ${MAKE_ARGS} 2>&1 | tee build.log

          echo "B_TIME=$(($(date +%s) - START_TIME))" >> $GITHUB_ENV

      - name: Get kernel version
        run: |
          KERNEL_VER=$(cat out/include/config/kernel.release 2>/dev/null || true)
          [ -z "$KERNEL_VER" ] && KERNEL_VER=$(make -s kernelversion)
          echo "KERNEL_VER=$KERNEL_VER" >> $GITHUB_ENV
          echo "Kernel version: $KERNEL_VER"

      - name: Set artifact name
        run: |
          ARTIFACT_NAME="Nadeko${VARIANT_TAGS}${KSU_TAG}-$(date +%y%m%d)-$(date +%H%M)-${GITHUB_SHA:0:9}"
          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> $GITHUB_ENV
          echo "Artifact name: $ARTIFACT_NAME"

      - name: Package AnyKernel3
        run: |
          git clone -b nadeko --depth=1 https://github.com/dre698/AnyKernel3.git anykernel
          cd anykernel
          rm -f zImage *.dtb

          if [ -f "../out/arch/${KERNEL_ARCH}/boot/Image.gz-dtb" ]; then
            cp ../out/arch/${KERNEL_ARCH}/boot/Image.gz-dtb Image.gz-dtb
            echo "✓ Copied Image.gz-dtb"
          elif [ -f "../out/arch/${KERNEL_ARCH}/boot/Image.gz" ]; then
            cp ../out/arch/${KERNEL_ARCH}/boot/Image.gz Image.gz
            echo "✓ Copied Image.gz"
          elif [ -f "../out/arch/${KERNEL_ARCH}/boot/Image" ]; then
            cp ../out/arch/${KERNEL_ARCH}/boot/Image Image
            echo "✓ Copied Image"
          else
            echo "✗ No kernel image found!"
            ls -lah ../out/arch/${KERNEL_ARCH}/boot/
            exit 1
          fi

          cp ../out/arch/${KERNEL_ARCH}/boot/dtb*.img . 2>/dev/null || echo "No DTB files"

          cat > anykernel.sh << EOF
          properties() { '
          kernel.string=${KERNEL_STRING}
          do.devicecheck=1
          device.name1=blossom
          device.name2=dandelion
          device.name3=angelica
          device.name4=angelican
          device.name5=cattail
          device.name6=angelicain
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          '; }

          BLOCK=auto;
          IS_SLOT_DEVICE=0;
          RAMDISK_COMPRESSION=auto;

          . tools/ak3-core.sh;
          dump_boot;
          write_boot;
          EOF

          zip -r9 ../${ARTIFACT_NAME}.zip * -x .git README.md *placeholder

          Z_MD5=$(md5sum ../${ARTIFACT_NAME}.zip | cut -d ' ' -f1)
          echo "Z_MD5=$Z_MD5" >> $GITHUB_ENV

      - name: Package Prebuilt Artifacts
        if: inputs.prebuilts
        run: |
          echo "Creating prebuilt artifacts package..."
          mkdir -p prebuilt/modules
          mkdir -p prebuilt/headers

          if [ -f "out/arch/${KERNEL_ARCH}/boot/Image.gz-dtb" ]; then
            cp out/arch/${KERNEL_ARCH}/boot/Image.gz-dtb prebuilt/kernel
            echo "✓ Copied Image.gz-dtb as kernel"
          elif [ -f "out/arch/${KERNEL_ARCH}/boot/Image.gz" ]; then
            cp out/arch/${KERNEL_ARCH}/boot/Image.gz prebuilt/kernel
            echo "✓ Copied Image.gz as kernel"
          elif [ -f "out/arch/${KERNEL_ARCH}/boot/Image" ]; then
            cp out/arch/${KERNEL_ARCH}/boot/Image prebuilt/kernel
            echo "✓ Copied Image as kernel"
          else
            echo "✗ No kernel image found!"
            exit 1
          fi

          if [ -f "out/arch/${KERNEL_ARCH}/boot/dtb.img" ]; then
            cp out/arch/${KERNEL_ARCH}/boot/dtb.img prebuilt/
            echo "✓ Copied dtb.img"
          else
            echo "⚠ No dtb.img found"
          fi

          if [ -f "out/arch/${KERNEL_ARCH}/boot/dtbo.img" ]; then
            cp out/arch/${KERNEL_ARCH}/boot/dtbo.img prebuilt/
            echo "✓ Copied dtbo.img"
          else
            echo "⚠ No dtbo.img found"
          fi

          MODULES_FOUND=$(find out/ -name "*.ko" -print -quit)
          if [ -n "$MODULES_FOUND" ]; then
            find out/ -name "*.ko" -exec cp {} prebuilt/modules/ \;
            echo "✓ Copied kernel modules"
          else
            echo "⚠ No kernel modules found"
          fi

          if [ -d "out/staging/usr/include" ]; then
            cp -r out/staging/usr/include prebuilt/headers/
            echo "✓ Copied headers from out/staging/usr/include"
          elif [ -d "usr/include" ]; then
            cp -r usr/include prebuilt/headers/
            echo "✓ Copied headers from usr/include"
          else
            echo "⚠ No headers found"
          fi

          cd prebuilt
          zip -r9 ../${ARTIFACT_NAME}-prebuilts.zip *

      - name: Upload AnyKernel package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_NAME }}.zip
          retention-days: 30

      - name: Upload Prebuilt Artifacts
        if: inputs.prebuilts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}-prebuilts
          path: ${{ env.ARTIFACT_NAME }}-prebuilts.zip
          retention-days: 30

      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log-${{ env.ARTIFACT_NAME || github.run_id }}
          path: build.log
          retention-days: 7

      - name: Telegram notification
        if: always() && inputs.notify
        run: |
          esc() { sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'; }

          COMPILER_VER=$(${CLANG_DIR:-/tmp/clang}/bin/clang --version 2>/dev/null | head -1 | sed -E 's/ *\([^)]*\)//g; s/ version / /' | esc || true)
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          if [ "$KSU" = "nadekosu" ]; then
            TITLE="NadekoSU ${KSU_TAG#-nsu}"
          else
            TITLE="Vanilla"
          fi
          FEATURES=$(echo "${VARIANT_TAGS#-}" | sed 's/-/ + /g')

          THREAD_ARG=""
          [ -n "$THREAD_ID" ] && THREAD_ARG="-F message_thread_id=${THREAD_ID}"

          if [ "${{ job.status }}" == "success" ]; then
            B_MIN=$((${{ env.B_TIME }} / 60))
            B_SEC=$((${{ env.B_TIME }} % 60))
            CAPTION="<b>Nadeko Kernel</b> | ${TITLE}"$'\n'
            [ -n "$FEATURES" ] && CAPTION+="<b>Features:</b> ${FEATURES}"$'\n'
            CAPTION+=$'\n'"<b>Kernel:</b> $(echo "$KERNEL_VER" | esc)"$'\n'
            CAPTION+="<b>Compiler:</b> ${COMPILER_VER}"$'\n'
            CAPTION+="<b>Build time:</b> ${B_MIN}m ${B_SEC}s"$'\n'
            CAPTION+="<b>MD5:</b> <code>${{ env.Z_MD5 }}</code>"
            curl -s -F chat_id="$GROUP_CHAT_ID" $THREAD_ARG \
              -F document=@${{ env.ARTIFACT_NAME }}.zip \
              --form-string caption="$CAPTION" \
              -F parse_mode=HTML \
              "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument"
          else
            CAPTION="<b>Nadeko Kernel</b> | ${TITLE}"$'\n'
            [ -n "$FEATURES" ] && CAPTION+="<b>Features:</b> ${FEATURES}"$'\n'
            CAPTION+=$'\n'"<b>Build failed.</b> <a href=\"${RUN_URL}\">View run</a>"
            if [ -f build.log ]; then
              curl -s -F chat_id="$GROUP_CHAT_ID" $THREAD_ARG \
                -F document=@build.log \
                --form-string caption="$CAPTION" \
                -F parse_mode=HTML \
                "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument"
            else
              curl -s -F chat_id="$GROUP_CHAT_ID" $THREAD_ARG \
                --form-string text="$CAPTION" \
                -F parse_mode=HTML \
                "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage"
            fi
          fi
