# MTK Kernel Build with KernelSU-Next Integration
# Defconfig: blossom_noksu_defconfig
# This is an alternative build to main.yml/NadekoSU.yml, which use ReSukiSU/NadekoSU instead.

name: Build Nadeko Kernel with KernelSU-Next

on:
  workflow_dispatch:

env:
  TZ: "Asia/Jakarta"
  KERNEL_DEFCONFIG: "blossom_ksun_defconfig"
  KERNEL_ARCH: "arm64"
  KBUILD_BUILD_USER: "Telegram"
  KBUILD_BUILD_HOST: "dre698"
  BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}

jobs:
  build_and_package:
    name: Build Kernel & Package AnyKernel3
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y bc bison flex build-essential libssl-dev libelf-dev cpio kmod git zip curl ca-certificates jq \
            wget libffi-dev zlib1g-dev libreadline-dev libsqlite3-dev libbz2-dev libncurses5-dev libgdbm-dev liblzma-dev tk-dev

      - name: Configure git
        run: |
          git config --global http.sslVerify false
          git config --global url."https://".insteadOf git://

      - name: Clone crdroid Clang
        run: |
          echo "Cloning crdroid Clang..."
          git clone --depth=1 https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r428724.git /tmp/clang

      - name: Clone LineageOS GCC toolchains
        run: |
          echo "Cloning GCC ARM64..."
          GIT_SSL_NO_VERIFY=1 git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git /tmp/gcc-aarch64

          echo "Cloning GCC ARM32..."
          GIT_SSL_NO_VERIFY=1 git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git /tmp/gcc-arm

      - name: Verify toolchains
        run: |
          /tmp/clang/bin/clang --version
          /tmp/gcc-aarch64/bin/aarch64-linux-android-gcc --version
          /tmp/gcc-arm/bin/arm-linux-androideabi-gcc --version

      # NOTE: unlike main.yml, this uses the official KernelSU-Next setup script.
      # There is no "register trusted manager" step here on purpose -
      # that hack is specific to ReSukiSU/NadekoSU. KernelSU-Next verifies
      # its own manager app signature and doesn't need it.
      - name: Integrate KernelSU-Next
        run: |
          chmod u+x clean.sh
          chmod u+x syscall_hook.sh
          bash clean.sh
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy
          bash syscall_hook.sh

      - name: Get KernelSU-Next version
        run: |
          KSU_GIT_VER=$(cd KernelSU-Next && git rev-list --count HEAD 2>/dev/null || echo "0")
          KSUN_VER=$((30000 + KSU_GIT_VER + 200))
          echo "KSUN_VER=$KSUN_VER" >> $GITHUB_ENV
          echo "KernelSU-Next version: $KSUN_VER"

      - name: Build kernel
        run: |
          START_TIME=$(date +%s)
          export PATH="/tmp/clang/bin:/tmp/gcc-aarch64/bin:/tmp/gcc-arm/bin:${PATH}"

          export ARCH=${KERNEL_ARCH}
          export CROSS_COMPILE="aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="arm-linux-androideabi-"
          export CC="clang"
          export CLANG_TRIPLE="aarch64-linux-gnu-"

          make O=out ARCH=${ARCH} ${KERNEL_DEFCONFIG}

          echo "Building kernel with KernelSU-Next..."
          make -j$(nproc) \
            O=out \
            ARCH=${ARCH} \
            CC=clang \
            CLANG_TRIPLE=${CLANG_TRIPLE} \
            CROSS_COMPILE=${CROSS_COMPILE} \
            CROSS_COMPILE_ARM32=${CROSS_COMPILE_ARM32} \
            2>&1 | tee build.log

          echo "B_TIME=$(($(date +%s) - START_TIME))" >> $GITHUB_ENV

      - name: Set artifact name
        run: |
          ARTIFACT_NAME="Nadeko-ksun${KSUN_VER}-$(date +%y%m%d)-$(date +%H%M)-${GITHUB_SHA:0:9}"
          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> $GITHUB_ENV
          echo "Artifact name: $ARTIFACT_NAME"

      - name: Package AnyKernel3
        run: |
          git clone -b nadeko --depth=1 https://github.com/dre698/AnyKernel3.git anykernel
          cd anykernel
          rm -f zImage *.dtb

          if [ -f "../out/arch/${KERNEL_ARCH}/boot/Image.gz-dtb" ]; then
            cp ../out/arch/${KERNEL_ARCH}/boot/Image.gz-dtb Image.gz-dtb
            echo "✓ Copied Image.gz-dtb"
          elif [ -f "../out/arch/${KERNEL_ARCH}/boot/Image.gz" ]; then
            cp ../out/arch/${KERNEL_ARCH}/boot/Image.gz Image.gz
            echo "✓ Copied Image.gz"
          elif [ -f "../out/arch/${KERNEL_ARCH}/boot/Image" ]; then
            cp ../out/arch/${KERNEL_ARCH}/boot/Image Image
            echo "✓ Copied Image"
          else
            echo "✗ No kernel image found!"
            ls -lah ../out/arch/${KERNEL_ARCH}/boot/
            exit 1
          fi

          cp ../out/arch/${KERNEL_ARCH}/boot/dtb*.img . 2>/dev/null || echo "No DTB files"

          cat > anykernel.sh << 'EOF'
          properties() { '
          kernel.string=
          do.devicecheck=1
          device.name1=blossom
          device.name2=dandelion
          device.name3=angelica
          device.name4=angelican
          device.name5=cattail
          device.name6=angelicain
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          '; }

          BLOCK=auto;
          IS_SLOT_DEVICE=0;
          RAMDISK_COMPRESSION=auto;

          . tools/ak3-core.sh;
          dump_boot;
          write_boot;
          EOF

          zip -r9 ../${ARTIFACT_NAME}.zip * -x .git README.md *placeholder

          Z_MD5=$(md5sum ../${ARTIFACT_NAME}.zip | cut -d ' ' -f1)
          echo "Z_MD5=$Z_MD5" >> $GITHUB_ENV

      - name: Upload AnyKernel package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_NAME }}.zip
          retention-days: 30

      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log-${{ env.ARTIFACT_NAME }}
          path: build.log
          retention-days: 7

      - name: Telegram notification
        if: always()
        run: |
          COMPILER_VER=$(/tmp/clang/bin/clang --version | head -1 | sed 's/ (.*//')
          if [ "${{ job.status }}" == "success" ]; then
            B_MIN=$((${{ env.B_TIME }} / 60))
            B_SEC=$((${{ env.B_TIME }} % 60))
            CAPTION=$(printf "build succeeded in %sm, %ss\nmd5: \`%s\`\ncompiler: %s" "$B_MIN" "$B_SEC" "${{ env.Z_MD5 }}" "$COMPILER_VER")
            for CHAT in "$GROUP_CHAT_ID"; do
              curl -s -F chat_id="$CHAT" $( [ "$CHAT" = "$GROUP_CHAT_ID" ] && echo "-F message_thread_id=2" ) \
                -F document=@${{ env.ARTIFACT_NAME }}.zip \
                -F caption="$CAPTION" \
                -F parse_mode=Markdown \
                "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument"
            done
          else
            for CHAT in "$GROUP_CHAT_ID"; do
              curl -s -F chat_id="$CHAT" $( [ "$CHAT" = "$GROUP_CHAT_ID" ] && echo "-F message_thread_id=2" ) \
                -F document=@build.log \
                -F caption="build failed. check log." \
                "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument"
            done
          fi
